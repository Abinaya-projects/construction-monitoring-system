server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: buildsight-backend

  # Database configuration: defaults to SQLite file for local academic portability
  datasource:
    url: jdbc:sqlite:buildsight_academic.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 35MB

# Gemini AI Vision Configuration (Secured Server-Side)
buildsight:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent
    model: gemini-3.8-flash
    timeout-ms: 30000

# File Upload Storage Directory
  storage:
    upload-dir: ./uploads/observations

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
